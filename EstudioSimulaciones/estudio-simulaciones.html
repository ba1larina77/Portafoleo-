<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Simulaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e13;--panel:#151920;--panel2:#1c212b;--line:#2a303c;--txt:#e7eaf0;--mute:#8a93a6;--acc:#7c5cff;--acc2:#20d3a0;--rec:#d61f45}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
header{height:66px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:#0f1218}
header h1{font-size:16px;margin:0;white-space:nowrap;letter-spacing:.3px}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}
.tab{flex:1;max-width:280px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.tab:hover{border-color:#495267}
.tab.active{background:linear-gradient(135deg,#7c5cff,#20b8d3);border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(124,92,255,.35)}
.tab:disabled{opacity:.45;cursor:not-allowed}
main{display:flex;height:calc(100% - 66px)}
#panel{width:410px;min-width:340px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 12px 40px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px;min-width:0;background:radial-gradient(circle at 50% 40%,#161a24,#0a0b0f)}
#view{background:#000;box-shadow:0 0 0 1px var(--line),0 12px 50px rgba(0,0,0,.7);border-radius:6px;display:block}
#status{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;min-height:16px}
#status.rec{color:#ff5c7a;font-weight:700}
.modehead h2{margin:2px 0 2px;font-size:18px}
.modehead .note{margin-bottom:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.actions button:nth-child(4),.actions button:nth-child(5){grid-column:span 1}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:650;font-size:13px;font-family:inherit}
button:hover:not(:disabled){border-color:#4d5669;background:#232936}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff}
button.rec.on{animation:pulse 1s infinite}
button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
@keyframes pulse{50%{opacity:.6}}
details.sec{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel2)}
details.sec>summary{padding:10px 12px;cursor:pointer;font-weight:750;user-select:none}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.secbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:128px 1fr;align-items:center;gap:8px}
.row .lbl{color:var(--mute);font-size:12px}
.rng{display:flex;gap:6px;align-items:center;min-width:0}
.rng input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.rng input[type=number]{width:74px}
input,select,textarea{background:#0e1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;font-size:13px;min-width:0}
input[type=color]{padding:2px;height:32px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);justify-self:start}
textarea{width:100%;resize:vertical;min-height:52px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.note{color:var(--mute);font-size:12px}
.sub{font-weight:700;font-size:12px;color:#c9cfdb;margin-top:6px;text-transform:uppercase;letter-spacing:.6px}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:22px;height:22px;border-radius:4px;border:2px solid #0006;cursor:pointer;padding:0}
.sw.sel{outline:2px solid #fff;outline-offset:1px}
canvas.ed{image-rendering:pixelated;background:#222;border-radius:6px;cursor:crosshair;touch-action:none;max-width:100%}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:8px}
.card canvas{width:100%;height:auto;border-radius:4px;image-rendering:pixelated;background:#000}
.card.sel{outline:2px solid var(--acc);background:#2a2350}
.cname{font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.cstat{font-size:10px;color:var(--mute);text-align:center}
.fighter{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222a38;border:1px solid #3a4458;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1}
@media (max-width:900px){main{flex-direction:column-reverse;height:auto}#panel{width:100%;min-width:0;border-right:0}#stage{min-height:70vh}header{height:auto;flex-wrap:wrap;padding:10px}.tabs{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>🎬 Estudio de Simulaciones</h1>
  <nav id="tabs" class="tabs"></nav>
</header>
<main>
  <aside id="panel"></aside>
  <section id="stage">
    <canvas id="view" width="1080" height="1920"></canvas>
    <div id="status"></div>
  </section>
</main>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   CONSTANTES Y UTILIDADES
   ===================================================================== */
const W = 1080, H = 1920, DT = 1 / 60, TAU = Math.PI * 2;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const PIXEL_FONT = '"Press Start 2P","Courier New",monospace';
const SANS_FONT = 'system-ui,"Segoe UI",Roboto,Arial,sans-serif';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function deepMerge(def, src) {
  if (src === undefined || src === null) return deepClone(def);
  if (Array.isArray(def)) return Array.isArray(src) ? src : deepClone(def);
  if (def && typeof def === 'object') {
    if (typeof src !== 'object') return deepClone(def);
    const out = {};
    for (const k in def) out[k] = (k in src) ? deepMerge(def[k], src[k]) : deepClone(def[k]);
    for (const k in src) if (!(k in out)) out[k] = src[k];
    return out;
  }
  return (typeof src === typeof def || def === null) ? src : def;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
let toastTimer = 0;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function pickFile(accept, multiple) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = !!multiple; i.onchange = () => res([...i.files]); i.click(); });
}
function hexToRgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
/** Dibuja texto centrado con salto de línea automático. Devuelve la altura usada. */
function drawText(ctx, text, x, y, o = {}) {
  if (!text) return 0;
  const size = o.size || 60, font = o.font || SANS_FONT, weight = o.weight || '900', lh = size * (o.lineH || 1.15);
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  const lines = []; for (const para of String(text).split('\n')) lines.push(...wrapLines(ctx, para, o.maxW || 960));
  let yy = y;
  for (const ln of lines) {
    if (o.strokeW) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW; ctx.strokeStyle = o.stroke || 'rgba(0,0,0,.9)'; ctx.strokeText(ln, x, yy); }
    if (o.shadow) { ctx.shadowColor = o.shadowColor || o.color || '#fff'; ctx.shadowBlur = o.shadow; }
    ctx.fillStyle = o.color || '#fff'; ctx.fillText(ln, x, yy); ctx.shadowBlur = 0; yy += lh;
  }
  ctx.restore(); return lines.length * lh;
}

/* =====================================================================
   RNG CON SEMILLA (mulberry32)
   ===================================================================== */
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() { let t = this.s = (this.s + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
}

/* =====================================================================
   SISTEMA DE PARTÍCULAS (compartido)
   ===================================================================== */
class Particles {
  constructor(max = 2500) { this.list = []; this.max = max; }
  add(o) {
    if (this.list.length >= this.max) return;
    const p = { x: 0, y: 0, vx: 0, vy: 0, life: 1, size: 6, color: '#fff', g: 0, drag: 0.92, shape: 'circle' };
    Object.assign(p, o); p.max = p.life; this.list.push(p);
  }
  burst(x, y, n, o, rng) {
    for (let i = 0; i < n; i++) {
      const a = rng.next() * TAU, sp = rng.range(o.minSpeed ?? 80, o.speed ?? 500);
      const color = Array.isArray(o.colors) ? o.colors[Math.floor(rng.next() * o.colors.length)] : (o.color || '#fff');
      const life = o.life ?? 0.8, size = o.size ?? 6;
      this.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rng.range(life * 0.55, life), size: rng.range(size * 0.5, size), color, g: o.g || 0, drag: o.drag ?? 0.92, shape: o.shape || 'circle' });
    }
  }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      const d = Math.pow(p.drag, dt * 60); p.vx *= d; p.vy *= d; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  draw(ctx) {
    for (const p of this.list) {
      const a = clamp(p.life / p.max, 0, 1); ctx.globalAlpha = a; ctx.fillStyle = p.color;
      if (p.shape === 'square') { const s = p.size; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }
  clear() { this.list.length = 0; }
}

/* =====================================================================
   AUDIO ENGINE (Web Audio: altavoces + MediaStreamDestination)
   ===================================================================== */
class AudioEngine {
  constructor() { this.ctx = null; this.voices = 0; this.maxVoices = 32; this.last = {}; this.volume = 0.85; }
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const c = this.ctx;
      this.master = c.createGain(); this.master.gain.value = 1;
      this.comp = c.createDynamicsCompressor();
      this.comp.threshold.value = -12; this.comp.knee.value = 10; this.comp.ratio.value = 4; this.comp.attack.value = 0.003; this.comp.release.value = 0.2;
      this.out = c.createGain(); this.out.gain.value = this.volume;
      this.master.connect(this.comp); this.comp.connect(this.out);
      this.out.connect(c.destination);
      this.dest = c.createMediaStreamDestination();
      this.out.connect(this.dest);
      const len = c.sampleRate * 2; this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.media = new Map();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  get ready() { return !!this.ctx && this.ctx.state === 'running'; }
  setVolume(v) { this.volume = v; if (this.out) this.out.gain.value = v; }
  /** Devuelve false si la misma clave sonó hace menos de `ms` milisegundos. */
  throttle(key, ms) { const t = performance.now(); if (this.last[key] && t - this.last[key] < ms) return false; this.last[key] = t; return true; }
  _voice(total) { if (this.voices >= this.maxVoices) return false; this.voices++; setTimeout(() => this.voices--, (total + 0.08) * 1000); return true; }
  _env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  /** Oscilador con envolvente. fp = [[fracción de tiempo, frecuencia], ...] para curvas de tono. */
  tone(o) {
    if (!this.ready) return;
    const type = o.type || 'sine', f = o.f || 440, dur = o.dur || 0.2, vol = o.vol ?? 0.3, attack = o.attack || 0.005, delay = o.delay || 0;
    if (!this._voice(dur + delay)) return;
    const c = this.ctx, t = c.currentTime + 0.005 + delay;
    const osc = c.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.detune) osc.detune.value = o.detune;
    if (o.fp) for (const [fr, fq] of o.fp) osc.frequency.exponentialRampToValueAtTime(Math.max(20, fq), t + dur * fr);
    else if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + dur);
    if (o.vib) {
      const l = c.createOscillator(); l.frequency.value = o.vibRate || 6; const lg = c.createGain(); lg.gain.value = o.vib;
      l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    const g = c.createGain(); this._env(g, t, vol, attack, dur);
    let node = osc;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filterType || 'lowpass'; fl.frequency.setValueAtTime(o.filter, t); if (o.filter2) fl.frequency.exponentialRampToValueAtTime(o.filter2, t + dur); fl.Q.value = o.q || 1; node.connect(fl); node = fl; }
    node.connect(g); g.connect(o.out || this.master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  /** Ruido filtrado con envolvente. */
  noise(o) {
    if (!this.ready) return;
    const dur = o.dur || 0.2, vol = o.vol ?? 0.3, delay = o.delay || 0, attack = o.attack || 0.002;
    if (!this._voice(dur + delay)) return;
    const c = this.ctx, t = c.currentTime + 0.005 + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, t);
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur); fl.Q.value = o.q || 1;
    const g = c.createGain(); this._env(g, t, vol, attack, dur);
    s.connect(fl); fl.connect(g); g.connect(o.out || this.master);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  /** Conecta un <video>/<audio> al motor (para que su sonido entre en la grabación). */
  attachMedia(elm) {
    this.ensure();
    if (this.media.has(elm)) return this.media.get(elm);
    const src = this.ctx.createMediaElementSource(elm); const g = this.ctx.createGain(); g.gain.value = 0.9;
    src.connect(g); g.connect(this.master); this.media.set(elm, g); return g;
  }
}

/* =====================================================================
   RECORDER (canvas.captureStream + MediaStreamDestination + MediaRecorder)
   ===================================================================== */
class Recorder {
  constructor(app) { this.app = app; this.rec = null; this.chunks = []; this.active = false; }
  static pickMime() {
    if (!window.MediaRecorder) return '';
    const c = ['video/mp4;codecs="avc1.640028,mp4a.40.2"', 'video/mp4;codecs="avc1.42E01E,mp4a.40.2"', 'video/mp4;codecs=avc1,opus', 'video/mp4',
      'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { } }
    return '';
  }
  start(canvas, audio, name) {
    const vs = canvas.captureStream(60);
    const tracks = [...vs.getVideoTracks()];
    if (audio.dest) tracks.push(...audio.dest.stream.getAudioTracks());
    const stream = new MediaStream(tracks);
    this.mime = Recorder.pickMime();
    const opts = { videoBitsPerSecond: 14000000, audioBitsPerSecond: 192000 };
    if (this.mime) opts.mimeType = this.mime;
    this.rec = new MediaRecorder(stream, opts);
    this.chunks = [];
    this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => {
      const type = (this.rec.mimeType || this.mime || 'video/webm').split(';')[0];
      const blob = new Blob(this.chunks, { type });
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      download(blob, name + '.' + ext);
      vs.getTracks().forEach(t => t.stop());
      this.active = false; this.app.onRecordingDone(ext, blob.size);
    };
    this.rec.start(250); this.active = true;
  }
  stop() { if (this.rec && this.rec.state !== 'inactive') this.rec.stop(); }
}

/* =====================================================================
   CONSTRUCTOR DE CONTROLES (UI)
   ===================================================================== */
function makeUI(mode) {
  const done = o => { mode.save(); if (o.onChange) o.onChange(); if (o.reset) mode.app.resetMode(); };
  const row = (label, ctrl, hint) => { const r = el('div', 'row'); r.append(el('div', 'lbl', label), ctrl); if (hint) r.title = hint; return r; };
  return {
    row,
    section(title, open) {
      const d = el('details', 'sec'); const st = mode.openState[title]; d.open = st === undefined ? !!open : st;
      d.ontoggle = () => { mode.openState[title] = d.open; };
      const body = el('div', 'secbody'); d.append(el('summary', null, title), body);
      return { el: d, body, add(...n) { body.append(...n); return this; } };
    },
    num(obj, key, label, min, max, step, o = {}) {
      const wrap = el('div', 'rng'); const r = el('input'); r.type = 'range'; const n = el('input'); n.type = 'number';
      for (const i of [r, n]) { i.min = min; i.max = max; i.step = step; i.value = obj[key]; }
      const set = (v, final) => { v = parseFloat(v); if (isNaN(v)) return; obj[key] = v; r.value = v; n.value = v; if (final) done(o); else { mode.save(); if (o.live) o.live(); } };
      r.oninput = () => set(r.value, false); r.onchange = () => set(r.value, true); n.onchange = () => set(n.value, true);
      wrap.append(r, n); return row(label, wrap, o.hint);
    },
    text(obj, key, label, o = {}) {
      const i = el(o.multi ? 'textarea' : 'input'); if (!o.multi) i.type = 'text';
      i.value = obj[key] ?? ''; if (o.placeholder) i.placeholder = o.placeholder;
      i.oninput = () => { obj[key] = i.value; mode.save(); if (o.live) o.live(); }; i.onchange = () => done(o);
      return row(label, i, o.hint);
    },
    color(obj, key, label, o = {}) {
      const i = el('input'); i.type = 'color'; i.value = obj[key];
      i.oninput = () => { obj[key] = i.value; mode.save(); if (o.live) o.live(); }; i.onchange = () => done(o);
      return row(label, i, o.hint);
    },
    check(obj, key, label, o = {}) {
      const i = el('input'); i.type = 'checkbox'; i.checked = !!obj[key];
      i.onchange = () => { obj[key] = i.checked; done(o); }; return row(label, i, o.hint);
    },
    select(obj, key, label, opts, o = {}) {
      const s = el('select'); for (const [v, t] of opts) { const op = el('option', null, t); op.value = v; s.append(op); }

  stopRecording() {

  }
  onRecordingDone(ext, size) { toast(`Video descargado (${ext.toUpperCase()}, ${(size / 1048576).toFixed(1)} MB)`); }
  exportSettings() {
    const data = { app: 'Estudio de Simulaciones', mode: this.mode.id, settings: this.mode.settings, extra: this.mode.exportExtra() };
    download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `ajustes_${this.mode.id}_${stamp()}.json`);
  }
  async importSettings() {
    const [f] = await pickFile('application/json,.json'); if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (obj.mode && obj.mode !== this.mode.id && !confirm(`Este archivo es del modo "${obj.mode}". ¿Importarlo igualmente aquí?`)) return;
      this.mode.importSettings(obj.settings || obj); this.mode.importExtra(obj.extra); this.buildPanel(); this.resetMode(); toast('Ajustes importados');
    } catch (e) { alert('JSON inválido: ' + e.message); }
  }
  loop(now) {
    let dt = (now - this.last) / 1000; this.last = now; if (dt > 0.25) dt = 0.25; if (dt < 0) dt = 0;
    if (this.running) {
      this.acc += dt; let k = 0;

      if (k >= 4) this.acc = 0;

        this.recElapsed += dt;
        if (this.mode.finished && this.finishAt === null) this.finishAt = this.recElapsed;
        if ((this.finishAt !== null && this.recElapsed - this.finishAt >= 2) || this.recElapsed >= this.mode.settings.maxRec) this.stopRecording();

    this.render();
    this.mode.uiTick(dt);

  }
  render() {
    const c = this.ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.shadowBlur = 0; c.globalCompositeOperation = 'source-over';
    c.imageSmoothingEnabled = true;
    this.mode.draw(c);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.shadowBlur = 0;
    const wm = this.mode.settings.watermark;
    if (wm) { c.save(); c.globalAlpha = 0.6; c.font = `800 38px ${SANS_FONT}`; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(wm, W - 36, H - 34); c.fillStyle = '#fff'; c.fillText(wm, W - 36, H - 34); c.restore(); }
  }
  updateStatus() {
    const f = t => { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; };
    const e = this.statusEl;
    if (this.recording) { e.className = 'rec'; e.textContent = `● REC ${f(this.recElapsed)} / máx ${this.mode.settings.maxRec}s${this.mode.finished ? ' · final alcanzado, cerrando…' : ''}`; }
    else { e.className = ''; e.textContent = `${this.running ? '▶ Reproduciendo' : '⏸ En pausa'} · t = ${this.mode.time.toFixed(1)} s · semilla ${this.mode.settings.seed} · 1080×1920 @ 60 fps${this.mode.finished ? ' · ✔ final' : ''}`; }
  }
}

   MODO 1: FUSIÓN DE EMOJIS (física propia estilo Suika)

const LEVEL_COLORS = ['#ffd84d', '#ff9f43', '#ff5e57', '#ff4fa3', '#b467ff', '#5b8cff', '#2fd6c3', '#3ee57a', '#f5f5f5', '#ff7b54', '#9d4edd', '#00b4d8', '#e9c46a', '#ef476f'];
const MAX_CUSTOM_AUDIO_S = 3;

/** Separa un texto en emojis (graphemes). Los espacios y comas son opcionales. */
function parseEmojis(str) {
  str = String(str || '');
  if (window.Intl && Intl.Segmenter) {
    const out = [];
    for (const { segment } of new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(str)) if (segment.trim() && !/^[,;|]$/.test(segment)) out.push(segment);
    return out;
  }

}
/** Escala por defecto de sonido por combinación: el 1er combo suena como el original; cada nivel más grave y más lento. */
function autoCombos(levels, semis, stretch) {
  const out = [];
  for (let l = 2; l <= levels; l++) out.push({ pitch: -Math.round((l - 2) * semis * 2) / 2, speed: clamp(Math.round(100 / Math.max(0.2, 1 + (l - 2) * stretch)) / 100, 0.25, 3), vol: 1 });
  return out;
}
/** WSOLA: estira/encoge el tiempo sin cambiar el tono (mismos desplazamientos en todos los canales). */
function wsola(chs, factor, sr) {
  const N = Math.max(256, Math.round(sr * 0.04) & ~1), Hs = N >> 1, tol = N >> 2, len = chs[0].length;
  let mix = chs[0];
  if (chs.length > 1) { mix = new Float32Array(len); for (const c of chs) for (let i = 0; i < len; i++) mix[i] += c[i] / chs.length; }
  const w = new Float32Array(N); for (let i = 0; i < N; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const outLen = Math.ceil(len * factor) + N, outs = chs.map(() => new Float32Array(outLen)), norm = new Float32Array(outLen);
  let prev = 0;
  for (let k = 0; ; k++) {
    const nominal = Math.round(k * Hs / factor); if (nominal >= len) break;
    let start = nominal;
    if (k > 0) {
      const nat = prev + Hs, lo = Math.max(0, nominal - tol), hi = Math.min(len - N, nominal + tol);
      if (hi >= lo && nat + N <= len) {
        let best = -Infinity;
        for (let c = lo; c <= hi; c += 3) { let sum = 0; for (let i = 0; i < N; i += 4) sum += mix[c + i] * mix[nat + i]; if (sum > best) { best = sum; start = c; } }
      }
    }
    const o = k * Hs;
    for (let ch = 0; ch < chs.length; ch++) { const x = chs[ch], y = outs[ch]; for (let i = 0; i < N && start + i < len; i++) y[o + i] += x[start + i] * w[i]; }
    for (let i = 0; i < N; i++) norm[o + i] += w[i];
    prev = start;
  }
  const fin = Math.max(1, Math.ceil(len * factor));
  return outs.map(y => { const r = new Float32Array(fin); for (let i = 0; i < fin; i++) r[i] = norm[i] > 0.05 ? y[i] / norm[i] : y[i]; return r; });
}
/** Devuelve una copia del audio con el tono desplazado (semitonos) y la velocidad cambiada (×), de forma independiente. */
function transformBuffer(buf, semis, speed) {
  if (Math.abs(semis) < 0.01 && Math.abs(speed - 1) < 0.005) return buf;
  const pitch = Math.pow(2, semis / 12), sr = buf.sampleRate, factor = pitch / speed;

    for (let i = 0; i < rl; i++) { const p = i * pitch, i0 = p | 0, f = p - i0; r[i] = (x[i0] || 0) * (1 - f) + (x[i0 + 1] || 0) * f; }
    chs.push(r);
  }
  if (Math.abs(factor - 1) > 0.005) chs = wsola(chs, factor, sr);
  const len = chs[0].length, fade = Math.min(len, Math.round(sr * 0.01));
  for (const c of chs) for (let i = 0; i < fade; i++) c[len - 1 - i] *= i / fade;

/* ---------- Catálogo de mapas de Fusión ----------
   Un mapa = paredes (polilíneas con colisión), clavijas, barras giratorias y zonas de salida (cuellos).
   Cada mapa se construye con build(g), donde g = { nh: medio ancho del cuello, neckTop: y superior del cuello }. */
function ellipsePts(cx, cy, rx, ry, n = 360) { const p = []; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * TAU; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
function densify(pts, step = 7) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / step));
    for (let k = 0; k < n; k++) out.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
  }
  return out;
}
function heartPts(cx, cy, s, n = 400) {
  const p = [];
  for (let i = 0; i < n; i++) { const t = i / n * TAU, x = 16 * Math.pow(Math.sin(t), 3), y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); p.push([cx + x * s, cy - y * s]); }
  return p;
}
/** Abre el contorno cerrado en cada x de cuello y añade las paredes del cuello. */
function bottleMap(outline, neckXs, g, extra = {}) {
  const n = outline.length, cut = new Array(n).fill(false);
  for (const x of neckXs) {
    let top = Infinity; for (const [px, py] of outline) if (Math.abs(px - x) < g.nh + 12) top = Math.min(top, py);
    for (let i = 0; i < n; i++) { const p = outline[i], q = outline[(i + 1) % n], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; if (Math.abs(mx - x) < g.nh && my < top + g.nh * 1.5) cut[i] = true; }
  }
  const rims = []; let start = cut.indexOf(true), cur = null;
  if (start < 0) rims.push(outline.concat([outline[0]]));
  else {
    for (let k = 1; k <= n; k++) {
      const i = (start + k) % n;
      if (cut[i]) { if (cur) { rims.push(cur); cur = null; } continue; }
      if (!cur) cur = [outline[i]]; cur.push(outline[(i + 1) % n]);
    }
    if (cur) rims.push(cur);
  }
  const walls = rims.map(pts => ({ pts, kind: 'rim' }));
  for (const x of neckXs) {
    for (const r of rims) for (const e of [r[0], r[r.length - 1]]) {
      if (Math.abs(e[0] - x) > g.nh + 20) continue;
      const side = e[0] < x ? -1 : 1;
      if (e[1] > Math.min(...outline.filter(p => Math.abs(p[0] - x) < g.nh + 12).map(p => p[1])) + g.nh * 2.5) continue;
      walls.push({ pts: [e, [x + side * g.nh, e[1]], [x + side * g.nh, g.neckTop]], kind: 'neck' });
    }
  }
  for (const o of (extra.obstacles || [])) walls.push({ pts: o, kind: 'obs' });
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const [x, y] of outline) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  return {
    walls, pegs: extra.pegs || [], spinners: extra.spinners || [],
    spawns: neckXs.map(x => ({ x, top: g.neckTop })),
    center: [(minx + maxx) / 2, (miny + maxy) / 2], playTop: miny, bottom: maxy
  };
}

  removeClip(kind) {

  applyClipVolume() {
    const s = this.settings;

  onStart() { if (this.curClip) this.curClip.v.play().catch(() => { }); }
  onPause() { if (this.curClip) this.curClip.v.pause(); }
  onDeactivate() { this.onPause(); }
  beep(t) {
    const A = this.app.audio; if (!A.throttle('blk', 28)) return;
    const prog = 1 - this.remaining / this.total, f = (t === 1 ? 880 : 660) * (1 + prog * 0.6);

  }
  finish() {
    this.finished = true; this.endT = 0; this.flash = 1;
    const A = this.app.audio;
    [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, k) => A.tone({ type: 'square', f, dur: 0.18, vol: 0.12, delay: k * 0.07 }));
    [523.25, 659.25, 783.99].forEach(f => A.tone({ type: 'triangle', f: f / 2, dur: 1.4, vol: 0.18, delay: 0.45 }));
    A.noise({ dur: 1.2, vol: 0.25, f: 8000, f2: 400, type: 'lowpass', delay: 0.4 });

  }
  update(dt) {
    const s = this.settings; this.time += dt;

    for (let k = 0; k < sub; k++) { for (let i = 0, n = this.balls.length; i < n; i++) { const b = this.balls[i]; if (!b.dead) this.moveBall(b, h); } }
    if (this.balls.some(b => b.dead)) this.balls = this.balls.filter(b => !b.dead);
    const p = this.paddle; p.w = s.paddleWidth;
    // Power-ups: caen en línea recta atravesando el mapa
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i]; it.t += dt; it.y += s.itemSpeed * dt;
      if (!this.finished && it.y + 20 >= p.y && it.y - 20 <= p.y + p.h && Math.abs(it.x - p.x) < p.w / 2 + 45) { this.items.splice(i, 1); this.catchItem(it); continue; }
      if (it.y - 30 > GAME_H) this.items.splice(i, 1);

    let target = null, best = -1;
    for (const b of this.balls) if (b.vy > 0 && b.y > best && b.y < p.y + 10) { best = b.y; target = b; }
    let item = null; for (const it of this.items) if (it.y < p.y && (!item || it.y > item.y)) item = it;
    const ballT = target ? (p.y - target.y) / Math.max(1, target.vy) : Infinity, itemT = item ? (p.y - item.y) / s.itemSpeed : Infinity;
    const chase = s.itemAI && item && (!target || this.balls.length > 3 || itemT < ballT);

    this.hist.push(tx); if (this.hist.length > 90) this.hist.shift();
    const dN = Math.round(s.aiDelay / DT), aim = this.hist[Math.max(0, this.hist.length - 1 - dN)];
    p.x += clamp(aim - p.x, -s.aiSpeed * dt, s.aiSpeed * dt); p.x = clamp(p.x, p.w / 2, W - p.w / 2);

    if (!this.balls.length && !this.finished) { this.relaunchT += dt; if (this.relaunchT > 0.6) { this.relaunchT = 0; this.launch(); } }
    for (let i = this.flashes.length - 1; i >= 0; i--) { this.flashes[i].t -= dt; if (this.flashes[i].t <= 0) this.flashes.splice(i, 1); }
    for (let i = this.popups.length - 1; i >= 0; i--) { const q = this.popups[i]; q.t += dt; q.y -= 70 * dt; if (q.t > 1.1) this.popups.splice(i, 1); }

  draw(ctx) {

    ctx.fillStyle = '#141a5c'; ctx.fillRect(0, 0, W, GAME_H);

    ctx.fillStyle = '#fff';
    for (const f of this.flashes) { ctx.globalAlpha = f.t / 0.18; ctx.fillRect(f.x - cs / 2, f.y - cs / 2, cs, cs); }
    ctx.globalAlpha = 1;
    this.parts.draw(ctx);
    ctx.fillStyle = '#fff'; ctx.beginPath();
    for (const b of this.balls) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, TAU); }
    ctx.fill();
    // Power-ups
    for (const it of this.items) {
      const info = ITEM_TYPES[it.type], w = 96, h = 44, sc = 1 + Math.sin(it.t * 10) * 0.06;
      ctx.save(); ctx.translate(it.x, it.y); ctx.scale(sc, sc);
      ctx.globalAlpha = 0.25; ctx.fillStyle = info.color; ctx.fillRect(-w / 2 + 10, -h / 2 - 40, w - 20, 36); ctx.globalAlpha = 1;
      ctx.shadowColor = info.color; ctx.shadowBlur = 24; ctx.fillStyle = info.color;
      ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();

      ctx.restore();
    }
    const p = this.paddle;
    if (p.glow > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 40 * p.glow; }
    ctx.fillStyle = '#fff'; ctx.fillRect(p.x - p.w / 2, p.y, p.w, p.h); ctx.shadowBlur = 0;
    for (const q of this.popups) { ctx.globalAlpha = clamp(1.4 - q.t * 1.3, 0, 1); drawText(ctx, q.text, q.x, q.y, { size: 46, color: q.color, strokeW: 10, stroke: '#000', maxW: 600 }); }
    ctx.globalAlpha = 1;
    if (s.showCounter) {
      ctx.save(); ctx.font = `800 34px ${SANS_FONT}`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'left'; ctx.fillText(`🧱 ${this.remaining}`, 30, 33);
      ctx.textAlign = 'right'; ctx.fillText(`⚪ ${this.balls.length}`, W - 30, 33); ctx.restore();
    }
    if (this.finished) {
      if (this.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${this.flash * 0.8})`; ctx.fillRect(0, 0, W, GAME_H); }

      ctx.save(); ctx.translate(W / 2, GAME_H / 2); ctx.rotate(-0.06); ctx.scale(sc, sc);

  drawReaction(ctx, x, y, w, h) {
    const v = this.curClip && this.curClip.v;

      ui.button('Duplicar', () => { ed.id = this.newWeaponId(); ed.meta.name = (ed.meta.name + '2').slice(0, 14); this.edDirty = true; this.app.buildPanel(); }),
      ui.button('Eliminar', () => {
        if (!this.isMine(ed.id)) { alert('Las armas del catálogo no se pueden eliminar. Solo se eliminan tus armas o tus ediciones.'); return; }
        const inCat = WEAPON_CATALOG.some(c => c.id === ed.id);
        if (!confirm(inCat ? '¿Descartar tu edición y volver a la versión del catálogo?' : '¿Eliminar esta arma?')) return;
        s.weapons = s.weapons.filter(w => w.id !== ed.id); this.fixFighterWeapons();
        this.save(); this.loadEditor(this.getWeapon(inCat ? ed.id : 'sword')); this.app.buildPanel(); this.app.resetMode();
      })
    ));
    // Stats
    box.append(ui.text(ed.meta, 'name', 'Nombre', { live: dirty }));
    box.append(ui.num(ed.meta, 'damage', 'Daño por golpe', 1, 50, 1, { live: dirty, onChange: dirty }));
    box.append(ui.num(ed.meta, 'scale', 'Escala (px)', 2, 14, 0.5, { live: dirty, onChange: dirty }));
    box.append(ui.num(ed.meta, 'turn', 'Velocidad giro', 0.5, 12, 0.1, { live: dirty, onChange: dirty }));
    box.append(ui.num(ed.meta, 'cooldown', 'Cooldown (s)', 0.1, 2, 0.05, { live: dirty, onChange: dirty }));
    box.append(ui.select(ed.meta, 'anim', 'Animación', [['none', 'Ninguna'], ['swing', 'Swing (golpe)'], ['thrust', 'Estocada (se estira)'], ['spin', 'Giro rápido'], ['frames', 'Frames (sprite)']], { onChange: dirty }));
    box.append(ui.num(ed.meta, 'animDur', 'Duración anim (s)', 0.1, 1.2, 0.05, { live: dirty, onChange: dirty }));
    box.append(ui.num(ed.meta, 'pitch', 'Tono del golpe (Hz)', 80, 1500, 10));
    // Herramientas
    const tools = [['pen', '✏️ Lápiz'], ['eraser', '🧽 Borrador'], ['fill', '🪣 Relleno'], ['grip', '✋ Agarre'], ['tip', '➜ Punta']];
    const tb = el('div', 'btnrow'), tbs = [];
    for (const [k, lab] of tools) { const b = ui.button(lab, () => { ed.tool = k; tbs.forEach(x => x.classList.toggle('sel', x.dataset.k === k)); }); b.dataset.k = k; b.classList.toggle('sel', ed.tool === k); tbs.push(b); tb.append(b); }
    box.append(tb);
    const pal = el('div', 'pal'), sws = [];
    const colIn = el('input'); colIn.type = 'color'; colIn.value = ed.color; colIn.style.width = '44px'; colIn.style.height = '24px';
    const pickCol = c => { ed.color = c; colIn.value = c; sws.forEach(x => x.classList.toggle('sel', x.dataset.c === c)); if (ed.tool === 'eraser' || ed.tool === 'grip' || ed.tool === 'tip') { ed.tool = 'pen'; tbs.forEach(x => x.classList.toggle('sel', x.dataset.k === 'pen')); } };
    for (const c of ED_SWATCHES) { const b = el('button', 'sw'); b.style.background = c; b.dataset.c = c; b.classList.toggle('sel', c === ed.color); b.onclick = () => pickCol(c); sws.push(b); pal.append(b); }
    colIn.oninput = () => pickCol(colIn.value); pal.append(colIn); box.append(pal);
    // Frames
    const fl = el('div', 'note');
    const updFrameLabel = () => fl.textContent = `Frame ${ed.cur + 1} / ${ed.frames.length}`;
    box.append(ui.btns(
      ui.button('◀', () => { ed.cur = (ed.cur - 1 + ed.frames.length) % ed.frames.length; updFrameLabel(); redraw(); }),
      ui.button('▶', () => { ed.cur = (ed.cur + 1) % ed.frames.length; updFrameLabel(); redraw(); }),
      ui.button('＋ Frame', () => { ed.frames.splice(ed.cur + 1, 0, new Array(ed.S * ed.S).fill(null)); ed.cur++; updFrameLabel(); redraw(); dirty(); }),
      ui.button('Duplicar frame', () => { ed.frames.splice(ed.cur + 1, 0, ed.frames[ed.cur].slice()); ed.cur++; updFrameLabel(); redraw(); dirty(); }),
      ui.button('Borrar frame', () => { if (ed.frames.length <= 1) return; ed.frames.splice(ed.cur, 1); ed.cur = Math.min(ed.cur, ed.frames.length - 1); updFrameLabel(); redraw(); dirty(); }),
      fl
    ));
    updFrameLabel();
    // Lienzo de pixel art
    const S = ed.S, CS = Math.floor(352 / S), cv = el('canvas', 'ed'); cv.width = S * CS; cv.height = S * CS;
    const redraw = () => {
      const g = cv.getContext('2d'); const fr = ed.frames[ed.cur];
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { g.fillStyle = (x + y) % 2 ? '#2a2d36' : '#23262e'; g.fillRect(x * CS, y * CS, CS, CS); }
      if (ed.onion && ed.cur > 0) { g.globalAlpha = 0.25; const pf = ed.frames[ed.cur - 1]; for (let i = 0; i < S * S; i++) if (pf[i]) { g.fillStyle = pf[i]; g.fillRect((i % S) * CS, ((i / S) | 0) * CS, CS, CS); } g.globalAlpha = 1; }
      for (let i = 0; i < S * S; i++) if (fr[i]) { g.fillStyle = fr[i]; g.fillRect((i % S) * CS, ((i / S) | 0) * CS, CS, CS); }
      const gx = ed.grip[0] * CS, gy = ed.grip[1] * CS;
      g.strokeStyle = '#00e5ff'; g.lineWidth = 2; g.beginPath(); g.moveTo(gx, gy); const L = S * CS * 0.3; const ex = gx + Math.cos(ed.tip) * L, ey = gy + Math.sin(ed.tip) * L; g.lineTo(ex, ey); g.stroke();
      g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - Math.cos(ed.tip - 0.5) * 10, ey - Math.sin(ed.tip - 0.5) * 10); g.moveTo(ex, ey); g.lineTo(ex - Math.cos(ed.tip + 0.5) * 10, ey - Math.sin(ed.tip + 0.5) * 10); g.stroke();
      g.strokeStyle = '#ffd23f'; g.lineWidth = 2; g.beginPath(); g.arc(gx, gy, CS * 0.8, 0, TAU); g.moveTo(gx - CS * 1.4, gy); g.lineTo(gx + CS * 1.4, gy); g.moveTo(gx, gy - CS * 1.4); g.lineTo(gx, gy + CS * 1.4); g.stroke();
    };
    const pos = e => { const rc = cv.getBoundingClientRect(); const fx = (e.clientX - rc.left) / rc.width * S, fy = (e.clientY - rc.top) / rc.height * S; return [Math.floor(fx), Math.floor(fy), fx, fy]; };
    const flood = (fr, x, y, col) => { const tgt = fr[y * S + x]; if (tgt === col) return; const st = [[x, y]]; while (st.length) { const [cx, cy] = st.pop(); if (cx < 0 || cy < 0 || cx >= S || cy >= S) continue; const i = cy * S + cx; if (fr[i] !== tgt) continue; fr[i] = col; st.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]); } };
    let drag = false;
    const act = (e, first) => {
      const [x, y, fx, fy] = pos(e), fr = ed.frames[ed.cur]; if (x < 0 || y < 0 || x >= S || y >= S) return;
      if (ed.tool === 'pen') fr[y * S + x] = ed.color;
      else if (ed.tool === 'eraser') fr[y * S + x] = null;
      else if (ed.tool === 'fill' && first) flood(fr, x, y, ed.color);
      else if (ed.tool === 'grip' && first) ed.grip = [x + 0.5, y + 0.5];
      else if (ed.tool === 'tip') { const dx = fx - ed.grip[0], dy = fy - ed.grip[1]; if (Math.hypot(dx, dy) > 0.6) ed.tip = Math.atan2(dy, dx); }
      dirty(); redraw();
    };
    cv.onpointerdown = e => { drag = true; cv.setPointerCapture(e.pointerId); act(e, true); };
    cv.onpointermove = e => { if (drag) act(e, false); };
    cv.onpointerup = () => { drag = false; };
    cv.oncontextmenu = e => e.preventDefault();
    redraw();
    box.append(cv, ui.note('✋ Agarre: clic donde se une a la bola. ➜ Punta: arrastra desde el agarre hacia la punta del arma.'));
    // Vista previa
    this.pv = el('canvas', 'ed'); this.pv.width = 260; this.pv.height = 260; this.pv.style.background = '#000';
    box.append(ui.sub('Vista previa'), this.pv);
    // Importar / exportar
    const fwIn = el('input'); fwIn.type = 'number'; fwIn.value = 0; fwIn.min = 0; fwIn.title = 'Ancho de cada frame en px (0 = imagen completa)';
    box.append(ui.row('Ancho de frame (px)', fwIn));
    box.append(ui.btns(
      ui.button('🖼 Subir PNG / sprite sheet', () => this.importPNG(parseInt(fwIn.value) || 0)),
      ui.button('⬇ Exportar arma JSON', () => { const wp = this.weaponFromEditor(); if (!wp) return alert('Arma vacía'); download(new Blob([JSON.stringify(wp, null, 1)], { type: 'application/json' }), `arma_${wp.name.toLowerCase()}.json`); }),
      ui.button('⬆ Importar arma JSON', async () => {
        const [f] = await pickFile('application/json,.json'); if (!f) return;
        try {
          const wp = JSON.parse(await f.text());
          if (!Array.isArray(wp.frames) || !wp.palette || !Array.isArray(wp.grip)) throw new Error('Faltan frames/palette/grip');
          const base = { name: 'IMPORT', damage: 9, scale: 7, turn: 4, cooldown: 0.4, anim: 'swing', animDur: 0.3, pitch: 500, tip: 0 };
          const full = Object.assign(base, wp); if (!full.id || this.allWeapons().some(w => w.id === full.id)) full.id = this.newWeaponId();
          s.weapons.push(full); this.save(); this.loadEditor(full); this.app.buildPanel(); toast('Arma importada: ' + full.name);
        } catch (e) { alert('JSON de arma inválido: ' + e.message); }
      })
    ));
    box.append(ui.btns(
      ui.button('💾 Guardar arma', () => this.saveEditorWeapon(), 'primary'),
      ui.button('Borrar mis armas (volver al catálogo)', () => {
        if (!confirm('¿Borrar todas tus armas y ediciones? El catálogo integrado se mantiene.')) return;
        s.weapons = []; this.fixFighterWeapons();
        this.save(); this.loadEditor(this.getWeapon(s.fighters[0].weapon)); this.app.buildPanel(); this.app.resetMode();
      })
    ));
    return box;
  }
  uiTick(dt) {
    if (!this.pv || !this.pv.isConnected || !this.ed) return;
    if (this.edDirty) { const wp = this.weaponFromEditor(); this.pvWeapon = wp; this.pvPrep = wp ? prepWeapon(wp) : null; this.edDirty = false; }
    const g = this.pv.getContext('2d'), P = this.pvState, wp = this.pvWeapon, prep = this.pvPrep;
    g.fillStyle = '#000'; g.fillRect(0, 0, 260, 260); g.imageSmoothingEnabled = false;
    if (!wp || !prep) { g.fillStyle = '#777'; g.font = '12px sans-serif'; g.textAlign = 'center'; g.fillText('Dibuja un arma…', 130, 130); return; }
    P.t += dt; const cx = 130, cy = 130, r = 20;
    const ta = P.t * 1.1, tx = cx + Math.cos(ta) * 105, ty = cy + Math.sin(ta) * 105;
    P.ang += clamp(angDiff(P.ang, Math.atan2(ty - cy, tx - cx)), -wp.turn * dt, wp.turn * dt);
    P.next -= dt; if (P.next <= 0) { P.next = 1.1; P.animT = 0; }
    if (P.animT >= 0) { P.animT += dt; if (P.animT > wp.animDur) P.animT = -1; }
    const sc = Math.min(wp.scale, 78 / prep.reach), pose = weaponPose(cx, cy, r, P.ang, P.animT, wp, prep, sc);
    g.fillStyle = '#ef4444'; g.beginPath(); g.arc(tx, ty, 13, 0, TAU); g.fill();
    g.fillStyle = '#39d353'; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    drawWeaponSprite(g, pose, wp, prep, sc);
    g.strokeStyle = 'rgba(0,229,255,.55)'; g.lineWidth = pose.half * 2; g.lineCap = 'round'; g.globalAlpha = 0.25;
    g.beginPath(); g.moveTo(pose.hx, pose.hy); g.lineTo(pose.tx, pose.ty); g.stroke(); g.globalAlpha = 1;
  }
}

window.addEventListener('DOMContentLoaded', () => { window.app = new App(); });
</script>
